[project]
name = "recoverai"
version = "0.1.0"
description = "Net-EV subscription payment recovery agent for Razorpay merchants. 'Do nothing' is a first-class action."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "lightgbm==4.7.0",
    "scikit-learn==1.9.0",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "streamlit==1.63.0",
    "razorpay==2.0.1",
    "anthropic==1.3.0",
    "matplotlib==3.11.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoverai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
